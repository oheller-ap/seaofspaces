<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlotte Heller — Custom Hand-Knit Basketball Jerseys</title>
    <meta name="description" content="Join the waitlist for a custom hand-knit basketball jersey by Charlotte Heller. Made to order in New York.">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #EDECE8;
            --paper-light: #F4F3EF;
            --ink: #1C1C1C;
            --stone: #7A7773;
            --steel: #D4D1CC;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: var(--paper);
        }

        body {
            font-family: 'Jost', sans-serif;
            color: var(--ink);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        nav {
            padding: 2rem 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .logo {
            font-family: 'Crimson Pro', serif;
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            color: var(--ink);
            text-transform: uppercase;
        }

        /* Hero */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
        }

        .hero-content {
            max-width: 520px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Image rotator */
        .rotator {
            width: 100%;
            aspect-ratio: 4/5;
            position: relative;
            margin: 0 auto 3rem;
            background: var(--steel);
            overflow: hidden;
        }

        .rotator .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.4s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .rotator .slide.active {
            opacity: 1;
        }

        h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 2.6rem;
            font-weight: 300;
            letter-spacing: 0.01em;
            color: var(--ink);
            line-height: 1.2;
            margin-bottom: 1.25rem;
        }

        .subtitle {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--stone);
            font-weight: 400;
            margin-bottom: 2.5rem;
        }

        /* Waitlist Form */
        .waitlist-form {
            display: flex;
            gap: 0.5rem;
            max-width: 440px;
            margin: 0 auto;
            border: 1px solid var(--ink);
            padding: 4px;
            background: var(--paper-light);
        }

        .waitlist-form input[type="email"] {
            flex: 1;
            padding: 0.85rem 1rem;
            border: none;
            background: transparent;
            font-family: 'Jost', sans-serif;
            font-size: 0.95rem;
            color: var(--ink);
            outline: none;
            min-width: 0;
        }

        .waitlist-form input[type="email"]::placeholder {
            color: var(--stone);
            opacity: 0.75;
        }

        .waitlist-form button {
            padding: 0.85rem 1.4rem;
            background: var(--ink);
            color: var(--paper-light);
            border: none;
            font-family: 'Jost', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease;
            white-space: nowrap;
        }

        .waitlist-form button:hover {
            background: var(--stone);
        }

        .honeypot {
            position: absolute;
            left: -9999px;
        }

        .success-message {
            display: none;
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--ink);
            color: var(--ink);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 440px;
            margin: 0 auto;
            background: var(--paper-light);
        }

        .success-message.visible {
            display: block;
            animation: fadeInUp 0.6s ease-out;
        }

        /* Footer */
        footer {
            padding: 2rem 4rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--stone);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        footer a {
            color: var(--stone);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.25s ease, color 0.25s ease;
        }

        footer a:hover {
            color: var(--ink);
            border-bottom-color: var(--ink);
        }

        /* Responsive */
        @media (max-width: 640px) {
            nav { padding: 1.5rem 1.5rem; }
            main { padding: 2rem 1.25rem; }
            h1 { font-size: 2rem; }
            .subtitle { font-size: 0.95rem; }
            .waitlist-form {
                flex-direction: column;
                padding: 6px;
            }
            .waitlist-form button {
                width: 100%;
                padding: 0.9rem;
            }
            footer { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Charlotte Heller</div>
    </nav>

    <main>
        <div class="hero-content">
            <div class="rotator" id="rotator">
                <div class="slide active" style="background-image: url('images/IMG_4693.jpeg')"></div>
                <div class="slide" style="background-image: url('images/IMG_4697.jpeg')"></div>
                <div class="slide" style="background-image: url('images/IMG_4698.jpeg')"></div>
                <div class="slide" style="background-image: url('images/IMG_4972.jpeg')"></div>
                <div class="slide" style="background-image: url('images/IMG_4973.jpeg')"></div>
                <div class="slide" style="background-image: url('images/IMG_4984.jpeg')"></div>
                <div class="slide" style="background-image: url('images/IMG_4988.jpeg')"></div>
                <div class="slide" style="background-image: url('images/IMG_4992.jpeg')"></div>
            </div>

            <h1>Custom hand-knit<br>basketball jerseys</h1>
            <p class="subtitle">One-of-one jerseys, knit by hand in New York.<br>Join the waitlist and we'll reach out.</p>

            <form
                name="waitlist"
                method="POST"
                data-netlify="true"
                netlify-honeypot="bot-field"
                class="waitlist-form"
                id="waitlistForm"
            >
                <input type="hidden" name="form-name" value="waitlist">
                <p class="honeypot">
                    <label>Don't fill this out: <input name="bot-field"></label>
                </p>
                <input type="email" name="email" placeholder="your@email.com" required>
                <button type="submit">Join Waitlist</button>
            </form>

            <div class="success-message" id="successMessage">
                You're on the list. We'll be in touch when a commission slot opens up.
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Charlotte Heller · <a href="https://www.instagram.com/seaofspaces/" target="_blank" rel="noopener">Instagram</a></p>
    </footer>

    <script>
        // Image rotator
        const slides = document.querySelectorAll('#rotator .slide');
        let currentSlide = 0;
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 4500);

        // Waitlist form
        const form = document.getElementById('waitlistForm');
        const success = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = new FormData(form);
            try {
                await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(data).toString()
                });
                form.style.display = 'none';
                success.classList.add('visible');
            } catch (err) {
                form.submit();
            }
        });
    </script>
</body>
</html>
