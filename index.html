<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlotte Heller — Custom Hand-Knit Basketball Jerseys</title>
    <meta name="description" content="Join the waitlist for a custom hand-knit basketball jersey by Charlotte Heller. Made to order in New York.">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF8F3;
            --sage: #A8B5A0;
            --mint: #9DCFC4;
            --navy: #2C3E50;
            --blush: #E8D5D0;
            --charcoal: #3A3A3A;
            --soft-white: #FEFEFE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Jost', sans-serif;
            background: var(--cream);
            color: var(--charcoal);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        nav {
            padding: 2rem 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .logo {
            font-family: 'Crimson Pro', serif;
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: var(--navy);
            text-transform: uppercase;
        }

        /* Hero */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 640px;
            text-align: center;
            z-index: 2;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 3.4rem;
            font-weight: 300;
            letter-spacing: 0.02em;
            color: var(--navy);
            line-height: 1.15;
            margin-bottom: 1.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--charcoal);
            font-weight: 300;
            margin-bottom: 1rem;
            opacity: 0.85;
        }

        .lead-time {
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--sage);
            margin-bottom: 3rem;
            font-weight: 500;
        }

        /* Image slot */
        .image-slot {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 4/5;
            margin: 0 auto 3rem;
            background: linear-gradient(135deg, var(--blush) 0%, var(--mint) 100%);
            opacity: 0.35;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--navy);
        }

        /* Waitlist Form */
        .waitlist-form {
            display: flex;
            gap: 0.75rem;
            max-width: 480px;
            margin: 0 auto 1rem;
        }

        .waitlist-form input[type="email"] {
            flex: 1;
            padding: 0.95rem 1.4rem;
            border: 1.5px solid var(--sage);
            border-radius: 50px;
            background: var(--soft-white);
            font-family: 'Jost', sans-serif;
            font-size: 1rem;
            color: var(--charcoal);
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            min-width: 0;
        }

        .waitlist-form input[type="email"]:focus {
            border-color: var(--navy);
            box-shadow: 0 0 0 4px rgba(168, 181, 160, 0.15);
        }

        .waitlist-form input[type="email"]::placeholder {
            color: var(--charcoal);
            opacity: 0.45;
        }

        .waitlist-form button {
            padding: 0.95rem 1.8rem;
            background: var(--navy);
            color: var(--soft-white);
            border: none;
            border-radius: 50px;
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            white-space: nowrap;
        }

        .waitlist-form button:hover {
            background: var(--sage);
            transform: translateY(-1px);
        }

        .waitlist-form button:active {
            transform: translateY(0);
        }

        .honeypot {
            position: absolute;
            left: -9999px;
        }

        .form-note {
            font-size: 0.8rem;
            color: var(--charcoal);
            opacity: 0.55;
            letter-spacing: 0.03em;
        }

        .success-message {
            display: none;
            padding: 1.5rem 2rem;
            background: rgba(168, 181, 160, 0.15);
            border-radius: 12px;
            color: var(--navy);
            font-size: 1rem;
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto;
        }

        .success-message.visible {
            display: block;
            animation: fadeInUp 0.6s ease-out;
        }

        /* Footer */
        footer {
            padding: 2rem 4rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--sage);
            letter-spacing: 0.08em;
        }

        footer a {
            color: var(--sage);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        footer a:hover {
            border-bottom-color: var(--sage);
        }

        /* Ambient shapes */
        .floating-shapes {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.12;
            animation: float 24s infinite ease-in-out;
        }

        .shape-1 {
            width: 320px;
            height: 320px;
            background: var(--mint);
            top: -80px;
            left: -80px;
        }

        .shape-2 {
            width: 240px;
            height: 240px;
            background: var(--blush);
            bottom: -60px;
            right: -60px;
            animation-delay: 8s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.05); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            nav { padding: 1.5rem 1.5rem; }
            main { padding: 2rem 1.5rem; }
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 1rem; }
            .waitlist-form {
                flex-direction: column;
            }
            .waitlist-form button {
                width: 100%;
            }
            footer { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Charlotte Heller</div>
    </nav>

    <main>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
        </div>

        <div class="hero-content">
            <div class="image-slot">Image coming soon</div>

            <h1>Custom hand-knit<br>basketball jerseys</h1>
            <p class="subtitle">One-of-one jerseys, knit by hand in New York.<br>Join the waitlist and we'll reach out.</p>

            <form
                name="waitlist"
                method="POST"
                data-netlify="true"
                netlify-honeypot="bot-field"
                class="waitlist-form"
                id="waitlistForm"
            >
                <input type="hidden" name="form-name" value="waitlist">
                <p class="honeypot">
                    <label>Don't fill this out: <input name="bot-field"></label>
                </p>
                <input type="email" name="email" placeholder="your@email.com" required>
                <button type="submit">Join Waitlist</button>
            </form>

            <div class="success-message" id="successMessage">
                You're on the list. We'll be in touch when a commission slot opens up.
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Charlotte Heller · <a href="https://www.instagram.com/seaofspaces/" target="_blank" rel="noopener">Instagram</a></p>
    </footer>

    <script>
        const form = document.getElementById('waitlistForm');
        const success = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = new FormData(form);
            try {
                await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(data).toString()
                });
                form.style.display = 'none';
                success.classList.add('visible');
            } catch (err) {
                form.submit();
            }
        });
    </script>
</body>
</html>
